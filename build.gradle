plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	compileOnly 'org.projectlombok:lombok'
	implementation 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	constraints {
		implementation('com.fasterxml.jackson.core:jackson-databind:2.21.8') {
			because 'Fix CVE-2026-110879: polymorphic type validation bypass'
		}
		implementation('tools.jackson.core:jackson-databind:3.1.8') {
			because 'Fix CVE-2026-110879: polymorphic type validation bypass'
		}
	}
}

configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.name == 'jackson-databind') {
			if (details.requested.group == 'com.fasterxml.jackson.core') {
				details.useVersion '2.21.8'
				details.because 'Fix CVE-2026-110879: polymorphic type validation bypass'
			} else if (details.requested.group == 'tools.jackson.core') {
				details.useVersion '3.1.8'
				details.because 'Fix CVE-2026-110879: polymorphic type validation bypass'
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
